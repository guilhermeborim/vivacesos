name: Sass CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm install

      # ===== LINT =====
      - name: Lint API
        run: CI_BRANCH=${{ github.base_ref }} npx eslint web --ext .ts,.tsx

      - name: Lint Web
        run: CI_BRANCH=${{ github.base_ref }} npx eslint web --ext .ts,.tsx
