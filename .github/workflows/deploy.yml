name: Deploy

on:
  push:
    branches: [develop]

jobs:
  deploy-api-staging:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    needs: changes
    if: github.ref == 'refs/heads/develop' && needs.changes.outputs.api == 'true'
    env:
      SVC_ID: my-service-id
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v3
      - run: railway up --service=${{ env.SVC_ID }}
  deploy-web-staging:
    needs: changes
    if: github.ref == 'refs/heads/develop' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy Web para Staging (Preview)
        run: vercel ./web --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
