name: PR Template Check

on:
  pull_request:
jobs:
  check-description:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body;

            if (!body) {
              core.setFailed("PR description is empty.");
            }

            const requiredSections = [
              "## 🧩 Issue",
              "## 📝 O que foi feito",
              "## 🎯 Objetivo",
              "## ✅ Checklist"
            ];

            const missingSections = requiredSections.filter(section => !body.includes(section));

            if (missingSections.length > 0) {
              core.setFailed(
                `Missing required sections:\n${missingSections.join("\n")}`
              );
            }

            const unchecked = body.match(/- \[ \]/g);

            if (unchecked && unchecked.length > 0) {
              core.setFailed("Todos os checklists devem estar marcados para completar o merge.");
            }

            const checked = body.match(/- \[x\]/gi);

            if (!checked || checked.length === 0) {
              core.setFailed("Você precisa completar o checklist.");
            }
